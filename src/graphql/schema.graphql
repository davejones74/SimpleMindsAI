"""
SimpleMindsAI — GraphQL article ledger + training registry schema.

Two layers, deliberately typed so the UI cannot confuse them:

ARTICLE DOMAIN (the learning unit; replaces the old Prompt/Completion/RewardScore)
  Article          a continuous-text document awaiting / undergoing review
  ReviewVerdict    a teacher or human verdict on an article (transient history)
  Consumption      a durable record of an article being trained on

TRAINING REGISTRY (durable, append-only; describes the EXPERIMENTAL lifecycle)
  DatasetSnapshot   immutable, hash-sealed dataset file
  ModelRecord        checkpoint registry with a status machine
  TrainingRunV2      full run record (baseline/trained eval, delta)
  EvaluationRecord   deterministic eval result on the immutable set

Only REVIEWED-and-unconsumed articles are trainable. Importance is
operator-controlled; the teacher may SUGGEST it but can never apply it.
"""

scalar DateTime

enum ArticleImportance {
  NORMAL
  IMPORTANT
  CRITICAL
}

enum ArticleStatus {
  INGESTED
  PENDING_REVIEW
  REVIEWED
  REJECTED
}

enum ReviewVerdictKind {
  APPROVE
  REJECT
  UNCERTAIN
}

enum ReviewAuthority {
  TEACHER
  HUMAN
  AUTOMATION
}

"""A single continuous-text article — the training unit."""
type Article {
  articleId: ID!
  contentHash: String!
  text: String!
  domain: String
  tags: [String!]!
  importance: ArticleImportance!
  importanceSource: String
  suggestedImportance: ArticleImportance   # advisory only; never applied by AI
  status: ArticleStatus!
  origin: String
  source: String
  model: String
  rawText: String          # pre-cleaning text, kept only for debugging
  uncertainty: Float
  missionRelevance: Float
  reviewRequested: Boolean!
  selectionReasons: [String!]!
  decidedBy: ReviewAuthority
  reviewCycleId: ID
  createdAt: DateTime!
  updatedAt: DateTime
  consumedAt: DateTime
  consumedRef: String      # runId that consumed it (first appearance)
  reviewCount: Int!
  trainable: Boolean!      # REVIEWED && !consumed
  reviews: [ReviewVerdict!]!
  events: [ArticleEvent!]!
}

"""Teacher/human verdict on an article (transient review history)."""
type ReviewVerdict {
  reviewId: ID!
  articleId: ID!
  verdict: ReviewVerdictKind!
  score: Float
  rationale: String
  authority: ReviewAuthority!
  reviewerModel: String
  reviewerVersion: String
  rubricVersion: String
  suggestedImportance: ArticleImportance
  reviewCycleId: ID
  applied: Boolean!
  resultingStatus: ArticleStatus!
  reason: String
  at: DateTime!
}

"""Audit of a status/importance transition on an article."""
type ArticleEvent {
  type: String!
  articleId: ID!
  from: String
  to: String
  actor: ReviewAuthority
  reason: String
  at: DateTime!
}

type ArticlePage {
  items: [Article!]!
  nextCursor: String
}

type ReviewResult {
  review: ReviewVerdict!
  article: Article!
  applied: Boolean!
}

type ConsumptionRecord {
  articleId: ID!
  contentHash: String!
  runId: String
  reused: Boolean!
  at: DateTime!
}

type ConsumptionResult {
  consumed: [ConsumptionRecord!]!
  skipped: [SkippedConsumption!]!
}

type SkippedConsumption {
  articleId: ID!
  reason: String!
  runId: String
}

type DomainCount {
  domain: String!
  count: Int!
}

type StatusCounts {
  ingested: Int!
  pendingReview: Int!
  reviewed: Int!
  rejected: Int!
}

type ImportanceCounts {
  normal: Int!
  important: Int!
  critical: Int!
}

type ArticleStats {
  totalArticles: Int!
  byStatus: StatusCounts!
  byImportance: ImportanceCounts!
  byDomain: [DomainCount!]!
  pendingReview: Int!
  reviewed: Int!
  rejected: Int!
  ingested: Int!
  trainable: Int!
  reviewCount: Int!
  avgReviewScore: Float
  """Distinct articles ever consumed (never lost)."""
  uniqueConsumed: Int!
  """Total training appearances (may exceed uniqueConsumed on explicit reuse)."""
  totalAppearances: Int!
  duplicationIndex: Float!
}

"""
Immutable dataset snapshot. Once written, the file is never touched again;
TrainingRunV2 records the exact datasetId+Version it consumed.
"""
type DatasetSnapshot {
  datasetId: ID!
  datasetVersion: String!
  source: String!
  recordCount: Int!
  articleCount: Int!
  syntheticCount: Int!
  syntheticShare: Float!
  file: String!
  hash: String!
  categories: [DomainCount!]
  createdAt: DateTime!
}

"""Checkpoint registry. Status derived from the last event."""
type ModelRecord {
  modelId: ID!
  kind: String!
  baseModel: String!
  parentModelId: ID
  trainingRunId: ID
  datasetId: ID
  checkpointPath: String
  status: String!
  evaluationScore: Float
  createdAt: DateTime!
}

type RunEvent {
  status: String!
  at: DateTime!
  note: String
}

"""Full durable TrainingRun."""
type TrainingRunV2 {
  runId: ID!
  status: String!
  startedAt: DateTime!
  completedAt: DateTime
  baseModel: String!
  resultModelId: ID
  datasetId: ID
  datasetVersion: String
  datasetFile: String
  recordCount: Int
  criticModel: String
  criticVersion: String
  rubricVersion: String
  curriculumVersion: String
  trainerVersion: String
  trainerKind: String
  examplesProcessed: Int
  baselineScore: Float
  trainedScore: Float
  evaluationDelta: Float
  promotionStatus: String
  note: String
  events: [RunEvent!]!
}

"""Deterministic evaluation."""
type EvaluationRecord {
  evalRunId: ID!
  modelId: ID!
  kind: String!
  datasetId: ID!
  datasetVersion: String!
  evaluatorVersion: String!
  score: Float!
  score100: Float!
  createdAt: DateTime!
}

input ArticleInput {
  text: String!
  domain: String
  tags: [String!]
  importance: ArticleImportance
  source: String
  rawText: String
  uncertainty: Float
  missionRelevance: Float
}

input ReviewInput {
  articleId: ID!
  verdict: ReviewVerdictKind!
  score: Float
  rationale: String
  authority: ReviewAuthority
  reviewerModel: String
  reviewerVersion: String
  rubricVersion: String
  suggestedImportance: ArticleImportance
  reviewCycleId: ID
}

input ConsumeArticlesInput {
  articleIds: [ID!]!
  runId: String
  allowReuse: Boolean
}

input SnapshotInput {
  source: String!
}

input ModelInput {
  kind: String!
  baseModel: String!
  parentModelId: ID
  trainingRunId: ID
  datasetId: ID
  checkpointPath: String
}

input EvalInput {
  evalRunId: ID
  modelId: ID!
  kind: String!
  datasetId: ID!
  datasetVersion: String!
  score: Float!
  evaluatorVersion: String!
}

input RunEventInput {
  runId: ID!
  status: String!
  note: String
}

type Query {
  stats: ArticleStats!
  articles(after: String, limit: Int, status: ArticleStatus, importance: ArticleImportance, consumed: Boolean, domain: String): ArticlePage!
  article(articleId: ID!): Article
  trainableArticles(after: String, limit: Int): ArticlePage!
  reviewQueue(after: String, limit: Int): ArticlePage!

  """Phase 2 registry queries."""
  datasetSnapshots: [DatasetSnapshot!]!
  models: [ModelRecord!]!
  model(modelId: ID!): ModelRecord
  activeModel: ModelRecord
  trainingRuns: [TrainingRunV2!]!
  trainingRun(runId: ID!): TrainingRunV2
  evaluations: [EvaluationRecord!]!
}

type Mutation {
  ingestArticle(input: ArticleInput!): Article
  recordReview(input: ReviewInput!): ReviewResult!
  setArticleImportance(articleId: ID!, importance: ArticleImportance!): Article!
  setArticleStatus(articleId: ID!, status: ArticleStatus!, reason: String): Article!
  requestArticleReview(articleId: ID!): Article!
  selectArticlesForReview(limit: Int): [ID!]!

  """Durable exactly-once consumption. Recorded even if training later fails."""
  markConsumed(input: ConsumeArticlesInput!): ConsumptionResult!
  purgeBuffer: Boolean!

  """Phase 2 registry mutations."""
  createDatasetSnapshot(input: SnapshotInput!): DatasetSnapshot!
  registerModel(input: ModelInput!): ModelRecord!
  recordEvaluation(input: EvalInput!): EvaluationRecord!
  promoteModel(modelId: ID!): ModelRecord!
  rejectModel(modelId: ID!): ModelRecord!
  runEvent(input: RunEventInput!): TrainingRunV2!
  recoverInterruptedRuns: [ID!]!
}
