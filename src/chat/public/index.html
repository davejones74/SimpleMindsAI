<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SimpleMindsAI — chat</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
    header { padding:10px 16px; background:var(--panel); border-bottom:1px solid #21262d; display:flex; gap:12px; align-items:baseline; }
    header h1 { font-size:15px; margin:0; }
    header .badge { font-size:11px; color:var(--dim); background:#0d1117; border:1px solid #21262d; padding:2px 8px; border-radius:999px; }
    main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:78%; padding:8px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
    .msg.user { align-self:flex-end; background:#1f6feb; }
    .msg.brain { align-self:flex-start; background:var(--panel); border:1px solid #21262d; }
    .msg .meta { font-size:10px; color:var(--dim); margin-top:4px; }
    .msg.brain .meta a.score { color:var(--ok); }
    footer { border-top:1px solid #21262d; padding:10px 16px; display:flex; gap:8px; }
    input { flex:1; background:var(--bg); border:1px solid #21262d; color:var(--fg); padding:9px 12px; border-radius:8px; }
    button { background:var(--accent); color:#0d1117; font-weight:600; border:0; padding:9px 16px; border-radius:8px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
  </style>
</head>
<body>
  <header>
    <h1>SimpleMindsAI</h1>
    <span class="badge" id="badge">loading…</span>
  </header>
  <main id="log">
    <div class="msg brain">Loop is up. Say anything — this window is part of the experiment: if the brain scores well on your prompt, it feeds back into training.</div>
  </main>
  <footer>
    <input id="input" placeholder="Type a message…" autofocus />
    <button id="send">Send</button>
  </footer>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const badge = document.getElementById("badge");

    function add(msg, meta) {
      const el = document.createElement("div");
      el.className = `msg ${meta.kind}`;
      el.textContent = msg;
      if (meta.meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta.meta;
        el.appendChild(m);
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function ask() {
      const message = input.value.trim();
      if (!message) return;
      add(message, { kind: "user" });
      input.value = "";
      sendBtn.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (data.error) {
          add(`error: ${data.error}`, { kind: "brain", meta: "mode=" + (data?.mode ?? "?") });
        } else {
          const el = add(data.reply, { kind: "brain" });
          el.dataset.promptId = data.message;
          el.dataset.completionId = "";
        }
      } catch (err) {
        add(`network error: ${err.message}`, { kind: "brain" });
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    fetch("/api/identity").then((r) => r.json()).then((d) => {
      badge.textContent = `brain=${d.mode} · model=${d.model}`;
    });
    sendBtn.onclick = ask;
    input.onkeydown = (e) => { if (e.key === "Enter") ask(); };
  </script>
</body>
</html>
